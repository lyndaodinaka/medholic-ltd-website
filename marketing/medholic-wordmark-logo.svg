<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 154" role="img" aria-labelledby="title desc">
  <title id="title">Medholic logo</title>
  <desc id="desc">Medholic Ltd logo in thick flowing orange, red, and blue script with a warm orange underline.</desc>
  <defs>
    <linearGradient id="medholicWarm" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="0.33" stop-color="#ff7300"/>
      <stop offset="0.68" stop-color="#ff3100"/>
      <stop offset="1" stop-color="#d9001b"/>
    </linearGradient>
    <linearGradient id="medholicBlue" x1="0" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#2bc8ff"/>
      <stop offset="0.44" stop-color="#0798f2"/>
      <stop offset="0.74" stop-color="#0074d9"/>
      <stop offset="1" stop-color="#004fac"/>
    </linearGradient>
    <linearGradient id="medholicSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a00"/>
      <stop offset="0.55" stop-color="#ff7b00"/>
      <stop offset="1" stop-color="#df3e00"/>
    </linearGradient>
    <filter id="softLift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.2" flood-color="#003f7d" flood-opacity="0.22"/>
    </filter>
    <filter id="gloss" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur"/>
      <feOffset dy="1" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>
  <rect width="620" height="154" fill="none"/>
  <g filter="url(#softLift)">
    <text x="14" y="99" fill="url(#medholicWarm)" stroke="#ff6400" stroke-width="4.8" paint-order="stroke fill" font-family="'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive" font-size="91" font-weight="900" font-style="italic" letter-spacing="-3" filter="url(#gloss)">Med</text>
    <text x="163" y="99" fill="url(#medholicBlue)" stroke="#0078d4" stroke-width="4.8" paint-order="stroke fill" font-family="'Brush Script MT', 'Segoe Script', 'Lucida Handwriting', cursive" font-size="91" font-weight="900" font-style="italic" letter-spacing="-3" filter="url(#gloss)">holic</text>
    <text x="524" y="98" fill="#005eb8" stroke="#004b9a" stroke-width="1.2" paint-order="stroke fill" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" letter-spacing="0">Ltd</text>
    <path d="M80 118 C173 102, 320 104, 512 118" fill="none" stroke="url(#medholicSweep)" stroke-width="9" stroke-linecap="round"/>
    <path d="M84 113 C178 100, 325 102, 508 115" fill="none" stroke="#ffba3a" stroke-width="2.6" stroke-linecap="round" opacity="0.62"/>
  </g>
</svg>
